[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "agentshield"
version = "1.0.0"
description = "Local-first AI agent security testing and runtime policy simulator"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["fastapi>=0.110,<1", "uvicorn[standard]>=0.27,<1", "pydantic>=2.6,<3"]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.4,<1"]
[project.scripts]
agentshield = "agentshield.cli:main"
[tool.setuptools.packages.find]
where = ["backend"]
[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
addopts = "-q"
[tool.ruff]
line-length = 100
target-version = "py310"
